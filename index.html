<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAM — tu asistente</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#111a2e;--line:#27334c;--text:#eef3ff;--muted:#9aa9c3;--accent:#8b7cff;--green:#47d7a1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#283164 0,transparent 50%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,Segoe UI,sans-serif;min-height:100vh}.app{max-width:980px;margin:auto;padding:24px 18px;min-height:100vh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:5px 0 18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#9b8bff,#5d65db);font-weight:900;font-size:20px;box-shadow:0 7px 25px #655bff55}.brand h1{font-size:20px;margin:0}.brand small{color:var(--muted)}button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:#18233b;border-radius:12px;padding:10px 15px}button:hover{border-color:#8177ff;background:#202b47}.connect{background:#f2f4f8;color:#111827;border:0;font-weight:700}.connect:hover{background:white}.status{font-size:12px;color:var(--muted);margin:14px 0}.status span{display:inline-block;width:8px;height:8px;border-radius:50%;background:#68758b;margin-right:7px}.status.on span{background:var(--green)}main{flex:1;display:flex;flex-direction:column;min-height:60vh}.welcome{text-align:center;margin:auto auto 22px;padding:28px 10px 5px}.welcome .orb{font-size:47px;filter:drop-shadow(0 5px 25px #8b7cff77)}.welcome h2{font-size:26px;margin:6px}.welcome p{max-width:530px;margin:8px auto;color:var(--muted)}.chips{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:20px}.chips button{font-size:13px;color:#d7dcf2}.messages{width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding:12px 0 22px}.msg{max-width:85%;padding:12px 15px;border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:#5146a8}.msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}.composer{max-width:760px;width:100%;margin:0 auto 8px;display:flex;gap:9px;padding:8px;border:1px solid var(--line);background:#10182a;border-radius:17px}.composer textarea{flex:1;resize:none;background:transparent;color:var(--text);border:0;outline:0;padding:9px;font:inherit;min-height:44px;max-height:150px}.send{background:var(--accent);border:0;font-weight:700;padding:0 18px}.foot{text-align:center;color:#7886a1;font-size:11px;margin:8px}.modal{position:fixed;inset:0;background:#050812cc;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.box{width:min(520px,100%);background:#121b30;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 25px 90px #0009}.box h2{margin:0 0 5px}.box p{color:var(--muted);font-size:13px}.box label{display:block;font-size:13px;margin:15px 0 6px;color:#cbd5e8}.box input,.box textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0c1323;color:var(--text);font:inherit;outline:none}.box input:focus,.box textarea:focus{border-color:var(--accent)}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.hint{font-size:12px!important}.hint a{color:#b8b0ff}.error{color:#ff9c9c!important;min-height:18px}.repos{width:100%;max-width:760px;margin:0 auto 12px;display:none}.repo{border:1px solid var(--line);background:var(--panel);padding:10px 13px;border-radius:12px;margin:7px 0}.repo a{color:#c9c1ff;text-decoration:none}.repo p{margin:3px 0 0;color:var(--muted);font-size:12px}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">M</div><div><h1>MAM</h1><small>Tu asistente, tus proyectos</small></div></div></header>
<div class="status" id="status"><span></span><b>IA local lista para descargar</b></div>
<main><section class="welcome" id="welcome"><div class="orb">✦</div><h2>Hola, soy MAM</h2><p>MAM usa un modelo de IA que se descarga y funciona en tu navegador. La primera vez puede tardar unos minutos.</p><div class="chips"><button data-prompt="¿Cómo puedo organizar un proyecto en GitHub?">Organizar un proyecto</button><button data-prompt="Ayúdame a entender cómo funcionan las ramas de GitHub.">Entender las ramas</button><button data-prompt="¿Qué puedo hacer con mis repositorios?">Ver mis repositorios</button></div></section><div class="messages" id="messages"></div></main>
<div class="composer"><textarea id="input" rows="1" placeholder="Escribe a MAM…"></textarea><button id="send" class="send">Enviar</button></div><div class="foot">Created by Mery</div></div>

<script type="module">
import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';
const $=s=>document.querySelector(s), chat=$('#messages'), input=$('#input'), sendButton=$('#send'), status=$('#status');
let generator=null;
const history=[{role:'system',content:'Eres MAM, un asistente amable y útil. Responde en español de forma clara y sencilla.'}];
function add(text,who){const el=document.createElement('div');el.className='msg '+who;el.textContent=text;chat.appendChild(el);el.scrollIntoView({behavior:'smooth',block:'end'});return el}
$('#form')?.addEventListener('submit',e=>e.preventDefault());
async function send(){const text=input.value.trim();if(!text||sendButton.disabled)return;input.value='';add(text,'user');sendButton.disabled=true;input.disabled=true;const pending=add('Preparando la IA…','bot');try{if(!generator){status.className='status';status.innerHTML='<span></span><b>Descargando modelo de IA…</b>';generator=await pipeline('text-generation','onnx-community/Qwen2.5-0.5B-Instruct',{dtype:'q4',device:'wasm',progress_callback:p=>{if(p.status==='progress'&&p.progress)status.innerHTML='<span></span><b>Descargando modelo: '+Math.round(p.progress)+' %</b>'}})}status.className='status on';status.innerHTML='<span></span><b>IA lista; pensando…</b>';history.push({role:'user',content:text});const result=await generator(history,{max_new_tokens:256,do_sample:false});const generated=result[0].generated_text;const answer=Array.isArray(generated)?generated[generated.length-1]?.content:String(generated);pending.textContent=answer||'No he podido generar una respuesta. Prueba otra pregunta.';history.push({role:'assistant',content:answer||''});status.innerHTML='<span></span><b>IA local lista</b>'}catch(err){if(history.at(-1)?.role==='user')history.pop();pending.textContent='No he podido iniciar el modelo. Comprueba la conexión y prueba con un navegador actualizado; la primera descarga puede tardar y requiere memoria.';status.innerHTML='<span></span><b>No se pudo cargar el modelo</b>';generator=null}finally{sendButton.disabled=false;input.disabled=false;input.focus();chat.scrollTop=chat.scrollHeight}}
sendButton.onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;send()});
</script></body></html>
